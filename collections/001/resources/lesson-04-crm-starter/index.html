<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Local CRM Exercise</title><style>body{background:#0e1012;color:#f4f4f4;font:16px/1.6 system-ui;margin:0}.wrap{width:min(760px,calc(100% - 32px));margin:30px auto}h1{line-height:1.2}label{display:grid;gap:4px;margin:10px 0}input,select,button{font:inherit;padding:10px;border-radius:8px}input,select{background:#202226;color:white;border:1px solid #6b6b6b;max-width:100%}button{background:#e6ab26;color:#111;border:0;font-weight:bold;cursor:pointer}.lead{background:#212327;border:1px solid #444;border-radius:12px;padding:14px;margin:12px 0}.lead select{width:100%}.muted{color:#c0bcb6}.note{border-left:4px solid #e6ab26;padding:12px;background:#292319}</style></head><body><main class="wrap"><p class="note"><strong>TRAINING ONLY:</strong> This page stores nothing. Use fictional sample names and services only. Refresh resets the exercise.</p><h1>My Local CRM Exercise</h1><p class="muted">Manage imaginary leads, change stages, and export a CSV. No login, database, email, or security backend is provided.</p><form id="f"><label>Fictional display name<input id="name" required maxlength="60" placeholder="Demo Customer A"></label><label>Service<input id="service" required maxlength="80" placeholder="TV mounting"></label><button>Add demo lead</button></form><p id="count"></p><div id="leads"></div><button id="export" type="button">Export CSV</button></main><script>(function(){const stages=['new','contacted','estimate_sent','scheduled','completed','closed'];let records=[{id:1,name:'Demo Customer A',service:'TV mounting',status:'new'},{id:2,name:'Demo Customer B',service:'Ceiling fan',status:'estimate_sent'}];const $=id=>document.getElementById(id);function render(){const box=$('leads');box.replaceChildren();$('count').textContent=records.length+' fictional leads · '+records.filter(x=>!['completed','closed'].includes(x.status)).length+' open';records.forEach(r=>{const d=document.createElement('div');d.className='lead';const h=document.createElement('strong');h.textContent=r.name+' — '+r.service;const select=document.createElement('select');select.setAttribute('aria-label','Stage for '+r.name);stages.forEach(stage=>{const option=document.createElement('option');option.value=stage;option.textContent=stage.replace('_',' ');select.append(option)});select.value=r.status;select.onchange=()=>{r.status=select.value;render()};d.append(h,select);box.append(d)})}const quote=s=>'"'+String(s).replace(/"/g,'""')+'"';$('f').onsubmit=e=>{e.preventDefault();records.push({id:Date.now(),name:$('name').value.trim(),service:$('service').value.trim(),status:'new'});e.target.reset();render()};$('export').onclick=()=>{const csv=['Name,Service,Status',...records.map(r=>[r.name,r.service,r.status].map(quote).join(','))].join('\r\n');const u=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));const a=document.createElement('a');a.href=u;a.download='fictional-crm-example.csv';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),10000)};render()})();</script></body></html>
